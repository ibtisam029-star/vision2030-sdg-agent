[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision2030-sdg-agent"
version = "0.1.0"
description = "Bilingual human-supervised road-safety incident analysis aligned to Saudi Vision 2030 and SDG 3"
requires-python = ">=3.11"
dependencies = ["anthropic>=0.40", "pydantic>=2", "typer>=0.12", "python-dotenv>=1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
vision2030-agent = "vision2030_sdg_agent.cli:app"

[tool.setuptools.package-data]
vision2030_sdg_agent = ["prompts/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
